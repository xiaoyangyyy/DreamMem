[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreammem"
version = "0.1.0"
description = "Evidence-guided constructive memory in masked diffusion language models"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "pyyaml",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "transformers",
  "tiktoken",
]

[project.scripts]
dreammem = "dreammem.cli:main"

[tool.setuptools.packages.find]
include = ["dreammem*"]
